server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    charset utf-8;
    gzip_static on;

    # Revalidate on every load (cheap 304s) so an app update is picked up
    # without users having to clear their browser cache.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    # 5tratumOS portals released before 5tratDoom 0.2.0 send /apps/axedoom/ to
    # the old noVNC page. Serve the browser-native game at those addresses too,
    # so existing links and the portal launcher keep working unchanged.
    location = /vnc_lite.html {
        try_files /index.html =404;
    }

    location = /vnc.html {
        try_files /index.html =404;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
