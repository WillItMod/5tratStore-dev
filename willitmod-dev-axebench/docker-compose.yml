version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: willitmod-dev-axebench_server_1
      APP_PORT: 5000

  server:
    image: ghcr.io/willitmod/axebench:v4.0.28-reporting.97091de5e5cc@sha256:edc01e4947f2711394af068451a6df9dce7bf24882fd747f3a4d849b77623c23
    restart: on-failure
    stop_grace_period: 30s
    init: true
    environment:
      AXE_HOST: 0.0.0.0
      AXE_PORT: 5000
      HOME: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
