releaseNotes: >-
  A current MUX response with an unconfirmed route now shows Pool estimate ·
  route unconfirmed. Missing, stale or malformed MUX data is labelled
  separately. Accepted pool estimates and history remain visible, and stale
  route estimates are never shown as live. Fresh routing elsewhere still
  shows zero currently routed here without erasing accepted work.

  This app-only update leaves DigiByte Core 9.26.6, its existing supervisor,
  Miningcore, initialization tools, wallet data and configuration unchanged.

  Previous 0.9.188 watchdog update:
  The memory watchdog now defaults to Off when no valid preference has been
  saved. Existing Auto, manual and Off choices, plus database-cache settings,
  are preserved. Enabled watchdog budgets exclude resident file-backed cache
  instead of treating it as private memory; missing measurements retain the
  conservative fallback.

  For a fresh memory-pressure pause, Home and Settings offer Turn off watchdog
  & resume Core. The action saves Off before requesting a resume. Updating
  alone does not clear a pause. Unexpected exits and unclean shutdowns still
  require explicit recovery.

  Both native architectures passed the real dashboard recovery flow, clean
  Core restart, and persisted wallet, chain, pruning and configuration checks.
  DigiByte Core remains 9.26.6. Miningcore, initialization tools and pool
  configuration are unchanged. The app and Core supervisor update together.

  Previous 0.9.187 Core update:
  DigiByte Core is updated to 9.26.6 using verified official amd64 and arm64
  binaries. The dashboard stays at 0.9.186. Miningcore, initialization tools,
  memory controls, wallet data and pruning settings are unchanged.

  All full nodes and miners must upgrade before mainnet block 24,490,000.
  Required DigiDollar history begins at block 23,627,520, so a small prune
  target is not a hard limit on total disk use. Allow Core to finish normal
  shutdown and startup. This update does not request a reindex or delete data.
  If required block or undo history is missing, inspect the startup error
  before taking recovery action. After activation, an older Core is not a
  safe recovery path. Upstream notes:
  https://github.com/DigiByte-Core/digibyte/releases/tag/v9.26.6

  Native 9.26.5-to-9.26.6 regtest upgrades preserved chains, descriptor wallets
  and configuration, and both mining algorithms passed template checks. These
  tests do not prove that every mainnet installation has the required history.

  Direct and mixed miners now keep their accepted-share hashrate visible
  when MUX is empty, offline, or routing other miners elsewhere. MUX-only
  headlines require matched worker identities; pool estimates and routed
  telemetry remain separately labelled. Worker cards also retain pool estimates
  when a previously MUX-connected miner reconnects directly. Accepted shares
  and history are unchanged.

  Current miner hash rate from 5tratMux appears separately from accepted-share
  estimates, with stale or unavailable telemetry handled explicitly. Block
  history checks the full block hash against the correct chain and refreshes
  confirmation and reorganisation status before showing a confirmed find.
  Unverified reports remain distinguishable from confirmed pool blocks.

  Block alerts in this browser is a separate local preference. Recent verified
  blocks queue across app tabs, with browser-only Close acknowledgements.
  Reorgs or unavailable proof retract the alert without acknowledging it.
  OS and MUX delivery and acknowledgements remain independently managed.

  SHA-256 and Scrypt histories retain their correct algorithm. Failed RPC checks
  are retried without skipping the next block. Existing memory controls are retained.
