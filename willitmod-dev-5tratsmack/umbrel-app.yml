manifestVersion: 1
id: willitmod-dev-5tratsmack
category: altcoin
name: 5tratSmack
version: "0.10.8"
tagline: Home-miner 5TRAT node, wallet, solo pool and atomic trade lab
description: >-
  DEV PRE-LAUNCH

  Install, synchronize the complete 5TRAT blockchain, create or restore a
  wallet, configure miners, and explore the chain before launch. The bundled
  Stratum service is deliberately locked until candidate block #1000.

  Block 1000 is included: when the accepted chain tip reaches block 999, the
  next template is block 1000 and mining opens automatically. The app does not
  wait for block 1001 and no restart is required. While locked, a clear
  reminder is shown on launch and every five minutes.

  5tratSmack is experimental DEV software. Back up both the mining wallet and
  trading recovery file before moving funds. The experimental shared trade
  book connects through the public 5TRAT DEX seed; every atomic swap still
  requires the participating wallets to approve and settle it.

  Miner connection after activation:
    - URL: `stratum+tcp://<your-5tratumos-host-ip>:57557`
    - Username: your 5TRAT address plus an optional worker name
    - Password: anything
developer: WillItMod
website: https://github.com/WillItMod/5tratSmack
repo: https://github.com/WillItMod/5tratSmack
support: https://github.com/WillItMod/5tratSmack/issues
dependencies: []
port: 21226
icon: https://raw.githubusercontent.com/WillItMod/umbrel-dev-community-store/main/willitmod-dev-5tratsmack/icon.png
gallery:
  - https://raw.githubusercontent.com/WillItMod/umbrel-dev-community-store/main/willitmod-dev-5tratsmack/images/1.png
  - https://raw.githubusercontent.com/WillItMod/umbrel-dev-community-store/main/willitmod-dev-5tratsmack/icon.png
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: sync
    type: text-with-progress
    refresh: 5s
    endpoint: 5tratsmack-app:3000/api/widget/sync
    link: ""
    example:
      type: text-with-progress
      link: ""
      title: 5TRAT sync
      text: 83%
      progressLabel: In progress
      progress: 0.83
  - id: pool
    type: three-stats
    refresh: 30s
    endpoint: 5tratsmack-app:3000/api/widget/pool
    link: ""
    example:
      type: three-stats
      link: ""
      items:
        - title: Hashrate
          text: "12.4"
          subtext: TH/s
        - title: Workers
          text: "2"
        - title: Best proof
          text: "8.2"
          subtext: M
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
  - data/node/debug.log
submitter: WillItMod
