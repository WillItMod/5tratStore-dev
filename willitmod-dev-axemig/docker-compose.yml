version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: willitmod-dev-axemig_server_1
      APP_PORT: 12150

  server:
    image: ghcr.io/willitmod/axemig:0.1.22-dev@sha256:b87581e4f23b5014499530615b3952a6c630400de51ef55e16ec03352b2ab968
    restart: on-failure
    stop_grace_period: 30s
    init: true
    environment:
      APP_VERSION: 0.1.22-dev
      AXEMIG_HOME: /data
      AXEMIG_PORT: 12150
      AXEMIG_HOST: 0.0.0.0
      AXEMIG_HELPER_IMAGE: ghcr.io/willitmod/axemig:0.1.22-dev@sha256:b87581e4f23b5014499530615b3952a6c630400de51ef55e16ec03352b2ab968
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
