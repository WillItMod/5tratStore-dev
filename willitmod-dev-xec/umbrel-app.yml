path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Adds current routed miner hash rate from 5tratMux, with its source and age
  shown separately from the pool's accepted-share estimates. Worker cards
  follow the active app route, include miners before their first share, and
  fall back to pool estimates when MUX telemetry is unavailable or stale.
  SHA-256 and Scrypt measurements remain separate; renamed workers are
  counted once. Accepted-share history, wallets and mining settings are
  preserved.

  Aligns the app and store version and pins the app image to a verified
  AMD64/ARM64 build. Node and pool images are unchanged.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "axexec-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "XEC sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "axexec-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
submitter: WillItMod
