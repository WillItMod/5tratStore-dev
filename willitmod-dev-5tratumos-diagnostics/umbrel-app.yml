manifestVersion: 1
id: willitmod-dev-5tratumos-diagnostics
category: utilities
name: 5tratumOS Diagnostics
version: "0.1.0"
tagline: Find node faults and download an email-ready support archive
description: >-
  A read-only support GUI for 5tratumOS nodes. Review memory, swap, storage,
  pressure and recent 5trat/Stratum log signals for 5tratSmack, AxeDGB, AxeBTC
  or another selected app, inspect bounded log tails, and download one ZIP
  archive to email to support. The app does not upload anything automatically
  and excludes wallet files, private keys, passwords, node configuration and
  process environments.
developer: WillItMod
website: https://5trat.com
repo: https://github.com/WillItMod/5tratumOS-Diagnostics
support: https://github.com/WillItMod/5tratumOS-Diagnostics/issues
