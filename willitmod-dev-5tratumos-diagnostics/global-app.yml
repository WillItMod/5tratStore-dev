manifestVersion: 1
id: willitmod-dev-axediagnostics
category: utilities
name: 5tratDiag
version: "0.1.9"
tagline: Node diagnostics and private support with your 5tratMux licence
description: >-
  Diagnostics and support included with a valid paid 5tratMux licence on this
  5tratumOS node. Annual and lifetime licences unlock the app; trials do not.
  The Orbit welcome screen guides unlicensed users to the existing 5tratMux
  purchase and activation flow. Review host and installed-app health, select
  logs, and download a bounded ZIP archive or submit it privately for support.
  Exports include retained host logs from the last 24 hours across reboots and
  the first detected kernel fault, with a warning when capture is incomplete.
  CPU package/core temperatures are recorded in health history. A separate
  offline helper captures read-only SMART/NVMe health and shutdown/error counters.
  Saved kernel crash records are collected from live and archived pstore.
  Unsupported, missing and stale hardware evidence is explicitly identified.
  Link your Discord account to open a private conversation with the maintainer
  in the dedicated 5trat Support server. Each customer has one active private
  conversation; no Discord DMs or changes to your DM privacy settings are needed.
  Support tickets, conversation channels and uploaded logs expire after 14 days;
  Discord applies its own backup retention policy. Archives stay in the private support service
  and are never posted to Discord. The app uploads only after you review and
  confirm your submission. It excludes wallet files, private keys, passwords,
  node configuration and process environments. The compiled app and support
  relay use signed licence verification and keep the device key outside the
  diagnostics container.
releaseNotes: >-
  Adds labelled CPU package/core temperature history and observed maxima,
  read-only SMART/NVMe drive health with a 15-minute history, and retained kernel
  crash records. Platform/ACPI and CPU control readings are kept separate from
  physical CPU readings. Missing, sleeping, unsupported, stale or denied sources
  are never reported as healthy. A separate compiled drive helper runs without
  network access; it needs low-level disk-query permissions but does not start
  self-tests, change drive settings or read disk contents. Existing health
  history, licensing, support conversations and review-before-upload are preserved.
  New readings begin after updating; past temperatures cannot be reconstructed.
