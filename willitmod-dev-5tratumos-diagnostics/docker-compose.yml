services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 3000

  app:
    image: ghcr.io/willitmod/5tratumos-diagnostics:0.1.9@sha256:e0a05a00ec5ad5ffc826b9475188799d9f43f3a3d332daefce3392e4a9cdbec8
    restart: unless-stopped
    depends_on:
      - support-relay
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      APP_VERSION: "0.1.9"
      APP_REVISION: b3e432b32771a06839a88af3d5e007cad94d29ae
      SUPPORT_RELAY_SOCKET: /run/5tratdiag-support/relay.sock
      EXPORT_DIR: /data/exports
      TARGET_DATA_DIR: /target-app-data
      TARGET_APP_ROOT: /target-app-root
      TARGET_APP_DATA_ROOT: /target-app-data-root
      TARGET_APPS_ROOT: /target-apps
      HOST_PROC: /host/proc
      HOST_VAR_LOG: /host/var-log
      HOST_DOCKER_CONTAINERS: /host/docker-containers
      HOST_JOURNAL: /host/var-log-journal
      HOST_SYS: /host/sys
      HOST_PSTORE_ARCHIVE: /host/pstore-archive
      DRIVE_HEALTH_ROOT: /host/drive-health
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${FIVETRAT_TARGET_APP_DATA_PATH:-/var/lib/5tratumos/apps/5tratsmack}:/target-app-data:ro
      - ${FIVETRAT_TARGET_APP_ROOT_PATH:-/opt/5tratumos/apps/5tratsmack}:/target-app-root:ro
      - ${FIVETRAT_TARGET_APP_DATA_ROOT_PATH:-/var/lib/5tratumos/apps}:/target-app-data-root:ro
      - ${FIVETRAT_TARGET_APPS_ROOT_PATH:-/opt/5tratumos/apps}:/target-apps:ro
      - /var/lib/5tratumos/diagnostics/mux:/host/mux-evidence:ro
      - support-receipt:/mux-state:ro
      - support-socket:/run/5tratdiag-support:ro
      - /var/lib/5tratumos/support/install_id.txt:/host/support/install_id.txt:ro
      - /proc:/host/proc:ro
      - /var/log:/host/var-log:ro
      - /var/lib/docker/containers:/host/docker-containers:ro
      - /var/log/journal:/host/var-log-journal:ro
      - /sys:/host/sys:ro
      - /var/lib/systemd/pstore:/host/pstore-archive:ro
      - drive-health:/host/drive-health:ro

  drive-probe:
    image: ghcr.io/willitmod/5tratumos-diagnostics:0.1.9-drive-probe@sha256:46b9ad1fcf0f00b68337b791d52da9c1110052dbf454aa025f10c9899ea3a575
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    # SMART/NVMe ioctls need these capabilities. The fixed-command offline
    # helper is the trust boundary; read-only mounts do not restrict ioctls.
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    device_cgroup_rules:
      - "b *:* r"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=8m
    environment:
      HOST_SYS: /host/sys
      HOST_DEV: /host/dev
      DRIVE_PROBE_DATA: /data
    volumes:
      - /dev:/host/dev:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /proc/sys/kernel/random/boot_id:/host/boot_id:ro
      - /var/lib/5tratumos/support/install_id.txt:/host/support/install_id.txt:ro
      - support-receipt:/mux-state:ro
      - drive-health:/data

  support-relay:
    image: ghcr.io/willitmod/5tratumos-diagnostics:0.1.5-relay@sha256:37a89eb8b70f7869c83e682e6b055670529f44a93ee1d3f3076390b1664bfbff
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      SUPPORT_SERVICE_URL: https://licensing.5trat.net/support
    volumes:
      - /var/lib/5tratumos/5tratmux:/var/lib/5tratumos/5tratmux:ro
      - /var/lib/5tratumos/support:/var/lib/5tratumos/support:ro
      - support-receipt:/var/lib/5tratumos/diagnostics-entitlement
      - support-socket:/run/5tratdiag-support

volumes:
  support-receipt:
  support-socket:
  drive-health:
