name: Validate PowPow pool stability successor
on:
  pull_request:
    paths:
      - "willitmod-dev-powpow/**"
      - "POWPOW-POOL-STABILITY-2026-11-02.json"
      - "release-records/powpow-pool-stability-*"
      - "scripts/powpow_pool_stability_release.py"
      - "tests/test_powpow_pool_stability_release.py"
      - "tests/powpow_pool_stability.py"
      - "tests/test_powpow_umbrel_grace.py"
      - "tests/test_bench_completed_summary_release.py"
      - ".github/workflows/validate-powpow-pool-stability.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-dev-powpow/**"
      - "POWPOW-POOL-STABILITY-2026-11-02.json"
      - "release-records/powpow-pool-stability-*"
      - "scripts/powpow_pool_stability_release.py"
      - "tests/test_powpow_pool_stability_release.py"
      - "tests/powpow_pool_stability.py"
      - "tests/test_powpow_umbrel_grace.py"
      - "tests/test_bench_completed_summary_release.py"
      - ".github/workflows/validate-powpow-pool-stability.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/powpow_pool_stability_release.py --check-baseline
      - run: python -m unittest discover -s tests -p test_powpow_pool_stability_release.py -v
      - name: Preserve the frozen PowPow and Bench release contracts
        env:
          PYTHONPATH: tests
        run: python -m unittest test_powpow_umbrel_grace test_powpow_startup_release test_bench_completed_summary_release -v
