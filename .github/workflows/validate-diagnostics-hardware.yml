name: Validate diagnostics hardware evidence release
on:
  pull_request:
    paths:
      - "willitmod-dev-5tratumos-diagnostics/**"
      - "DIAGNOSTICS-HARDWARE-2026-11-09.json"
      - "scripts/diagnostics_hardware_release.py"
      - "tests/test_diagnostics_hardware_release.py"
      - "tests/test_recovery_release.py"
      - ".github/workflows/validate-diagnostics-hardware.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-dev-5tratumos-diagnostics/**"
      - "DIAGNOSTICS-HARDWARE-2026-11-09.json"
      - "scripts/diagnostics_hardware_release.py"
      - "tests/test_diagnostics_hardware_release.py"
      - "tests/test_recovery_release.py"
      - ".github/workflows/validate-diagnostics-hardware.yml"
permissions:
  contents: read
jobs:
  validate-diagnostics-hardware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 scripts/diagnostics_hardware_release.py
      - name: Verify exact release and retained historical contracts
        env:
          PYTHONPATH: tests
        run: python3 -m unittest test_diagnostics_hardware_release test_recovery_release test_bch2_retention_permissions.RecipeReleaseTests -v
