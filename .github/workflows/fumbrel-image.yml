name: Build Fumbrel (multi-arch)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed 0.1.1-dev candidate (main branch only)
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - "willitmod-dev-fumbrel/**"
      - "scripts/fumbrel/**"
      - "tests/fumbrel/**"
      - ".github/workflows/fumbrel-image.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-dev-fumbrel/**"
      - "scripts/fumbrel/**"
      - "tests/fumbrel/**"
      - ".github/workflows/fumbrel-image.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r willitmod-dev-fumbrel/app/requirements.txt PyYAML
      - run: python scripts/fumbrel/build_catalog.py --check
      - run: python -m unittest discover -s tests/fumbrel -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build both architectures without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./willitmod-dev-fumbrel/app
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/willitmod/fumbrel:0.1.1-dev
          provenance: false
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'WillItMod/5tratStore-dev'
    runs-on: ubuntu-latest
    concurrency:
      group: fumbrel-publish-0.1.1-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing tag or an inconclusive registry response
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fumbrel/check_publish_tag.py --repository willitmod/fumbrel --tag 0.1.1-dev
      - name: Publish the explicitly approved DEV candidate
        uses: docker/build-push-action@v6
        with:
          context: ./willitmod-dev-fumbrel/app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/willitmod/fumbrel:0.1.1-dev
          provenance: false
