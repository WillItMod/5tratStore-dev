name: Build Fumbrel (multi-arch)
on:
  workflow_dispatch:
  push:
    branches: [main, feat/fumbrel-dev]
    paths:
      - "willitmod-dev-fumbrel/app/**"
      - "tests/fumbrel/**"
      - ".github/workflows/fumbrel-image.yml"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r willitmod-dev-fumbrel/app/requirements.txt PyYAML
      - run: python -m unittest discover -s tests/fumbrel -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./willitmod-dev-fumbrel/app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/willitmod/fumbrel:0.1.0-dev
          provenance: false
