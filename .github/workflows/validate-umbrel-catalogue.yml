name: Validate complete Umbrel catalogue
on:
  pull_request:
    paths:
      - "willitmod-dev-*/**"
      - "scripts/umbrel_catalogue_contract.py"
      - "tests/test_umbrel_catalogue_contract.py"
      - "tests/fixtures/umbrel_1_7_4_patch_compose.cjs"
      - ".github/workflows/validate-umbrel-catalogue.yml"
  push:
    branches: [main]
    paths:
      - "willitmod-dev-*/**"
      - "scripts/umbrel_catalogue_contract.py"
      - "tests/test_umbrel_catalogue_contract.py"
      - "tests/fixtures/umbrel_1_7_4_patch_compose.cjs"
      - ".github/workflows/validate-umbrel-catalogue.yml"
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Check all apps and reject stale runtime qualification
        run: python3 -m unittest discover -s tests -p test_umbrel_catalogue_contract.py -v
