name: Build XEC Bitcoin ABC image (multi-arch)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "willitmod-dev-xec/data/xecd/**"
      - ".github/workflows/xecd-abc-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Bitcoin ABC version
        id: version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from os import environ

          text = Path("willitmod-dev-xec/data/xecd/Dockerfile").read_text(encoding="utf-8", errors="replace")
          m = re.search(r"^ARG\s+BITCOINABC_VERSION=([^\s]+)\s*$", text, flags=re.M)
          if not m:
              raise SystemExit("BITCOINABC_VERSION not found in Dockerfile")

          out = environ.get("GITHUB_OUTPUT")
          if not out:
              raise SystemExit("GITHUB_OUTPUT not set")
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"version={m.group(1)}\n")
          PY

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./willitmod-dev-xec/data/xecd
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/willitmod/xecd-abc:${{ steps.version.outputs.version }}-nojemalloc
          provenance: false
